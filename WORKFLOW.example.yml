# ============================================================
# Symphony TS — FULL EXAMPLE
# 모든 기능을 사용하는 풀 구성 예시
# 실제 사용 시 이 파일을 WORKFLOW.md의 YAML 블록(--- 사이)에 복사하세요.
# ============================================================

# ── Workspace backend ────────────────────────────────────────
# "local" (기본값): workspace.root 아래에 이슈별 디렉토리 생성
# "docker": 이슈별 Docker 컨테이너를 생성
workspace_backend: docker

# ── Trackers ─────────────────────────────────────────────────
# 여러 트래커를 동시에 실행할 수 있습니다 (trackers: 배열).
# 단일 트래커는 tracker: (단수형)으로도 설정 가능합니다.
trackers:
  # ── Linear 트래커 (백엔드 팀 전용, 본인 할당 이슈만) ────────
  - kind: linear
    project_slug: "backend-abc123"
    api_key: $LINEAR_API_KEY
    assignee: me                # "me" = 현재 Linear 사용자, 또는 Linear user ID
    poll_interval_ms: 15000     # Linear: 15초마다 이슈 목록 갱신
    # endpoint: https://api.linear.app/graphql
    states:
      planning: Todo
      plan_review: Plan Review
      in_progress: In Progress
      in_review: In Review
      done: Done
      canceled: Canceled
    # active_states / terminal_states 생략 → states에서 자동 유도
    # 수동 override도 가능:
    # active_states: [Todo, Plan Review, In Progress]
    # terminal_states: [Done, Canceled]

    # repository: GitHub / Bitbucket PR 이벤트 통합 (선택)
    # repository.poll_interval_ms: PR 이벤트 폴링 주기 (이슈 폴링과 독립적)
    repository:
      kind: github
      repo: my-org/backend
      token: $GITHUB_TOKEN
      poll_interval_ms: 20000   # GitHub: 20초마다 PR 이벤트 폴링
      pr_label_filter: symphony # 이 레이블이 있는 PR만 추적
      event_source: polling     # polling | webhook
      # webhook_secret: $GITHUB_WEBHOOK_SECRET

      # ── Repository hooks ──────────────────────────────────
      # 실행 순서:
      #   컨테이너/디렉토리 생성
      #     → injectCredentials (Docker만)
      #     → hooks.after_create     ← clone 전 (credentials 후)
      #     → auto-clone             ← repository config 기반
      #     → hooks.after_clone      ← clone 후 (npm ci 등)
      #     → [에이전트 루프]
      #       → hooks.before_run
      #       → agent 실행
      #       → hooks.after_run
      #     → hooks.before_remove    ← 워크스페이스 제거 전
      # repository 없는 tracker → 모든 hooks + auto-clone 스킵.
      hooks:
        after_clone: |
          npm ci --prefer-offline
        before_run: |
          git fetch origin && git merge origin/main --no-edit
        after_run: |
          rm -rf node_modules/.cache
        before_remove: |
          echo "workspace $(pwd) removed at $(date)" >> /var/log/symphony-cleanup.log
        timeout_ms: 600000

  # ── Jira 트래커 (멀티레포 예시: 프론트/백엔드 레포 분기) ─────
  # Jira 이슈에 'frontend' 또는 'backend' 라벨을 달면 해당 레포로 라우팅됩니다.
  # 라벨이 없으면 default: true 레포(backend)로 폴백합니다.
  - kind: jira
    project_key: "KAN"
    host: https://my-org.atlassian.net   # ← 워크스페이스마다 수정 필요
    email: $JIRA_EMAIL
    api_token: $JIRA_API_TOKEN
    poll_interval_ms: 60000     # Jira Cloud: rate limit 엄격, 60초 권장
    states:
      planning: 진행 예정
      plan_review: 검토 중
      in_progress: 진행 중
      in_review: 리뷰 중
      done: 완료
      canceled: 취소
    repositories:
      - kind: bitbucket
        workspace: my-org
        repo_slug: frontend
        api_token: $BITBUCKET_API_TOKEN   # 워크스페이스 토큰: BITBUCKET_EMAIL 불필요
        poll_interval_ms: 30000
        event_source: polling
        issue_labels: [frontend]          # Jira 이슈에 'frontend' 라벨 → 이 레포
        hooks:
          after_clone: |
            npm ci --prefer-offline

      - kind: bitbucket
        workspace: my-org
        repo_slug: backend
        api_token: $BITBUCKET_API_TOKEN
        poll_interval_ms: 30000
        event_source: polling
        issue_labels: [backend]           # Jira 이슈에 'backend' 라벨 → 이 레포
        hooks:
          after_clone: |
            npm ci --prefer-offline

# ── Agents ───────────────────────────────────────────────────
# backends: 에이전트 백엔드 목록. 배열 순서대로 순차 실행됩니다.
# trigger 조건이 없으면 항상 실행됩니다.
# trigger.issue_labels: 이슈가 해당 레이블 중 하나라도 있어야 실행
# trigger.pr_labels:    PR-트리거 dispatch 시 PR이 해당 레이블을 가져야 실행
agents:
  max_concurrent: 5
  retry_backoff_ms: 10000
  # max_retries: 2

  # ── Self-review ────────────────────────────────────────────
  review:
    rounds: 2                   # 에이전트당 리뷰 라운드 수
    kinds:                      # 병렬로 실행할 리뷰 에이전트 (backends[].kind 참조)
      - claude
    # - codex                   # 추가 시 claude + codex가 각각 rounds번 실행 후 primary 에이전트가 결과 병합

  # ── Backends ───────────────────────────────────────────────
  backends:
    # ── Claude — 모든 이슈에서 메인 구현 담당 ────────────
    - kind: claude
      primary: true             # 메인 에이전트: 계획/구현/리뷰 병합에 사용. 미지정 시 첫 번째 에이전트가 기본값
      command: claude
      models:
        planning: opus           # 계획 수립 시 (new_issue, feedback, pr_feedback)
        implementation: sonnet   # 구현 시 (approval ✅ 후)
      max_turns: 30
      max_budget_usd: 10.0      # 선택: 턴당 지출 한도 (USD)
      mcp_config: ./mcp.json
      allowed_tools:            # 비어있으면 모든 툴 허용
        - Bash
        - Read
        - Edit
        - Write
      turn_timeout_ms: 7200000  # 2시간
      # trigger 없음 = 항상 실행

    # ── Codex — security 레이블 이슈에 보안 검토 추가 ────
    - kind: codex
      command: >
        codex
        --config shell_environment_policy.inherit=all
        --config model_reasoning_effort=xhigh
        --model gpt-5.3-codex
        app-server
      max_turns: 10
      approval_policy: never
      thread_sandbox: workspace-write
      turn_sandbox_policy:
        type: workspaceWrite
      trigger:
        issue_labels:
          - security
          - compliance

# ── Workspace ────────────────────────────────────────────────
workspace:
  root: /var/symphony/workspaces

# ── Docker backend (workspace_backend: docker 시 사용) ──────
docker:
  image: my-org/symphony-worker:v2.1.0
  auth_mount: /home/ci/.claude  # 호스트 경로를 컨테이너에 read-only 마운트
  memory: 8g
  cpus: "4"
  env: # 예시용 주입 환경변수 (아래의 것들은 지금 사용 안함)
    NPM_TOKEN: $NPM_TOKEN
    SENTRY_DSN: $SENTRY_DSN

# ── Slack (계획 승인 워크플로우) ──────────────────────────────
# Socket Mode를 사용합니다 (공인 IP 불필요, Slack 앱에서 Socket Mode 활성화 필요)
slack:
  bot_token: $SLACK_BOT_TOKEN
  app_token: $SLACK_APP_TOKEN    # App-Level Token (xapp-...) — Socket Mode 전용
  channel: $SLACK_CHANNEL_ID

# ── Server ───────────────────────────────────────────────────
server:
  port: 4000
  host: 127.0.0.1
